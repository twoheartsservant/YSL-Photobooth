<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/css/style.css?v=ysl-private-qr-pastel-v1"><style>body{background:#D9EFF9;color:#34495E}.mini{padding:90px 22px 22px;text-align:center}.mini img{position:fixed;top:18px;left:20px;width:min(180px,24vw);height:auto;object-fit:contain;object-position:left top}.mini h1{font-size:clamp(18px,3vw,34px)}.mini .count{font-size:clamp(24px,5vw,48px);font-weight:800;color:#34495E}.mini .slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.mini .slot{border:2px dashed #A7D8F0;border-radius:12px;padding:14px;min-width:70px}</style></head><body><main class="mini"><img src="/static/assets/Logo.png" alt="Young Servants of the Lord logo"><h1>YSL PHOTOBOOTH · MAIN DISPLAY</h1><p id="status">Waiting for session</p><div class="count" id="count">0 / 3</div><p>Session progress</p><div class="slots" id="slots"></div></main><script>async function update(){try{const r=await fetch('/api/state'),s=await r.json(),n=s.shot_count||3;document.getElementById('status').textContent=s.active?'Session active':'Ready for next guest';document.getElementById('count').textContent=`${s.photo_count} / ${n}`;document.getElementById('slots').innerHTML=Array.from({length:n},(_,i)=>{const p=s.photos.find(x=>x.slot===i+1);return `<div class="slot">${p?`<img style="width:60px;height:60px;object-fit:cover" src="${p.url}">`:'Waiting'}<br>Shot ${i+1}</div>`}).join('')}catch{}}update();setInterval(update,900)</script></body></html>
